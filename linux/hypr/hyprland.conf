exec-once = waybar
exec-once = gentoo-pipewire-launcher &
exec-once = gnome-keyring-daemon --start --components=secrets
# exec-once = hyprpaper
# exec-once = fcitx5 -d

general {
    gaps_in = 2
    gaps_out = 4

    border_size = 0

    layout = dwindle
}

decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeInOut, 0.42, 0, 0.58, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 2, easeInOut, popin 90%
    animation = windowsOut, 1, 2, easeInOut, popin 90%
    animation = windowsMove, 1, 2, easeInOut, slide
    animation = fade, 1, 3, linear
    animation = fadeDim, 1, 3, linear
    animation = workspaces, 1, 3, easeInOut, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

input {
    kb_layout = us
    kb_variant = dvorak

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

$mainMod = SUPER

bind = $mainMod, P, exec, grim ~/Pictures/screenshot/$(date +'%Y-%m-%d-%H%M%S').png
bind = $mainMod SHIFT, P, exec, grim -g "$(slurp)" ~/Pictures/screenshot/$(date +"%Y-%m-%d-%H%M%S").png
bind = $mainMod, code:24, exec, kitty
bind = $mainMod, code:25, exec, zen
bind = $mainMod, code:54, killactive,
bind = $mainMod, code:41, fullscreen,
bind = $mainMod, E, exec, tofi-drun | xargs hyprctl dispatch exec --
bind = $mainMod, J, togglesplit,
bind = $mainMod, G, togglefloating,
bind = $mainMod, M, exit,

# Move focus with mainMod + arrow keys
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Resizeactive by arrow key
bind = $mainMod CTRL, right, resizeactive, 30  0
bind = $mainMod CTRL, left,  resizeactive, -30 0
bind = $mainMod CTRL, up,    resizeactive, 0   -30
bind = $mainMod CTRL, down,  resizeactive, 0   30

# Move window by arrow key
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

windowrulev2 = suppressevent maximize, class:.*

windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Move window by mouse
bindm = SUPER, mouse:272, movewindow

# Resize window
bindm = SUPER, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
